[workspace]
resolver = "3"
members = [
    "crates/atproto",
    "crates/cli",
    "crates/document/mdx",
    "crates/document/model",
    "crates/leaflet/editor",
    "crates/leaflet/records",
    "crates/leaflet/web",
    "crates/workflow",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
# jacquard pins (springleaf-records): exact-pinned to the codegen binary's
# workspace version — see crates/leaflet/records/LEAFLET-PIN.md.
jacquard-common = { version = "=0.12.1", default-features = false, features = ["std"] }
jacquard-derive = "=0.12.1"
jacquard-lexicon = { version = "=0.12.1", default-features = false }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
springleaf-atproto = { version = "=0.2.0", path = "crates/atproto" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
