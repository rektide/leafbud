[workspace]
resolver = "3"
members = [
    "crates/atproto",
    "crates/cli",
    "crates/document/mdx",
    "crates/document/model",
    "crates/leaflet/editor",
    "crates/leaflet/records",
    "crates/leaflet/web",
    "crates/workflow",
]

[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
figment2 = { version = "0.11", features = ["toml"] }
tempfile = "3"
toml_edit = "0.25"
serde-saphyr = "=2.1.1"
satteri-arena = "=0.4.3"
satteri-ast = "=0.6.3"
satteri-pulldown-cmark = { version = "=0.6.7", features = ["mdx", "serde"] }
sha2 = "0.10"
yrs = { git = "https://github.com/y-crdt/y-crdt", rev = "e0b476b0ce613453c70d0bb477b955808aa79a07", version = "0.28.1", default-features = false }
# jacquard pins (springleaf-records): exact-pinned to the codegen binary's
# workspace version — see crates/leaflet/records/LEAFLET-PIN.md.
jacquard-common = { version = "=0.12.1", default-features = false, features = ["std"] }
jacquard-derive = "=0.12.1"
jacquard-lexicon = { version = "=0.12.1", default-features = false }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
jiff = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
springleaf-atproto = { version = "=0.5.0", path = "crates/atproto" }
springleaf-web = { version = "=0.5.0", path = "crates/leaflet/web" }
springleaf-workflow = { version = "=0.5.0", path = "crates/workflow" }
springleaf-document = { version = "=0.5.0", path = "crates/document/model" }
springleaf-mdx = { version = "=0.5.0", path = "crates/document/mdx" }
springleaf-editor = { version = "=0.5.0", path = "crates/leaflet/editor" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
uuid = { version = "1", features = ["serde", "v5"] }
