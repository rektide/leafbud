[package]
name = "springleaf-drafts"
description = "leaflet.pub web surface: cookie-authed /home RSC parsing and read RPCs"
version.workspace = true
edition.workspace = true

[dependencies]
base64.workspace = true
jacquard-common.workspace = true
jiff.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
springleaf-leaflet.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
# loopback responder for the offline /new probe tests (create.rs)
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread"] }

